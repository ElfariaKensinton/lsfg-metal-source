name: macOS companion build

on:
  pull_request:
    paths:
      - "hud/**"
      - "control/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Scripts/build-hud.sh"
      - "Scripts/build-control.sh"
      - "Scripts/package.sh"
      - ".github/workflows/hud-build.yml"

jobs:
  build-companions:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate build scripts
        run: |
          sh -n Scripts/build-hud.sh
          sh -n Scripts/build-control.sh
          sh -n Scripts/package.sh

      - name: Build HUD package
        run: ./Scripts/build-hud.sh

      - name: Build settings GUI and shim package
        run: ./Scripts/build-control.sh

      - name: Verify x86_64 shim
        run: |
          file dist/renderers/lsfg/libMoltenVK.dylib
          test -s dist/renderers/lsfg/libMoltenVK.dylib

      - name: Upload macOS companion builds
        uses: actions/upload-artifact@v4
        with:
          name: lsfg-metal-macos-companions
          path: |
            dist/LSFG Metal Control.app
            dist/tools/LSFGMetalHUD
            dist/renderers/lsfg
          if-no-files-found: error
          compression-level: 6
