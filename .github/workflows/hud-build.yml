name: macOS companion build

on:
  pull_request:
    paths:
      - "hud/**"
      - "control/**"
      - "src/shim/**"
      - "src/bin/lsfg-control.rs"
      - "Cargo.toml"
      - "Scripts/build-hud.sh"
      - "Scripts/build-control.sh"
      - ".github/workflows/hud-build.yml"

jobs:
  build-companions:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate build scripts
        run: |
          sh -n Scripts/build-hud.sh
          sh -n Scripts/build-control.sh

      - name: Install x86_64 Rust target
        run: rustup target add x86_64-apple-darwin

      - name: Build live control helper
        run: cargo build --release --target x86_64-apple-darwin --bin lsfg-control

      - name: Build HUD
        run: swift build --package-path hud -c release

      - name: Build settings GUI
        run: swift build --package-path control -c release
