name: macOS companions

on:
  pull_request:
    paths:
      - "hud/**"
      - "control/**"
      - "Scripts/build-hud.sh"
      - "Scripts/build-control.sh"
      - ".github/workflows/hud-build.yml"

permissions:
  contents: read

jobs:
  build-companions:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build HUD
        run: ./Scripts/build-hud.sh

      - name: Build settings app
        run: ./Scripts/build-control.sh

      - name: Upload companion apps
        uses: actions/upload-artifact@v4
        with:
          name: lsfg-metal-upstream-companions
          path: |
            dist/LSFG Metal Control.app
            dist/tools/LSFGMetalHUD
          if-no-files-found: error
          compression-level: 6
