name: macOS companion build

on:
  pull_request:
    paths:
      - "hud/**"
      - "control/**"
      - "src/bin/lsfg-control.rs"
      - "Cargo.toml"
      - "Scripts/build-hud.sh"
      - "Scripts/build-control.sh"
      - ".github/workflows/hud-build.yml"

permissions:
  contents: read

jobs:
  build-companions:
    runs-on: macos-14
    steps:
      - name: Checkout GUI companions
        uses: actions/checkout@v4

      - name: Checkout upstream engine
        uses: actions/checkout@v4
        with:
          repository: itsOwen/lsfg-metal
          ref: main
          path: upstream-engine

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate companion scripts
        run: |
          sh -n Scripts/build-hud.sh
          sh -n Scripts/build-control.sh

      - name: Build upstream lsfg-metal engine
        working-directory: upstream-engine
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          ./Scripts/package.sh

      - name: Build HUD package
        run: ./Scripts/build-hud.sh

      - name: Build settings GUI package
        run: ./Scripts/build-control.sh

      - name: Verify upstream x86_64 shim
        run: |
          file upstream-engine/dist/renderers/lsfg/libMoltenVK.dylib
          test -s upstream-engine/dist/renderers/lsfg/libMoltenVK.dylib

      - name: Assemble artifact
        run: |
          rm -rf dist/renderers
          mkdir -p dist
          cp -R upstream-engine/dist/renderers dist/renderers

      - name: Upload macOS companion builds
        uses: actions/upload-artifact@v4
        with:
          name: lsfg-metal-upstream-companions
          path: |
            dist/LSFG Metal Control.app
            dist/tools/LSFGMetalHUD
            dist/renderers/lsfg
          if-no-files-found: error
          compression-level: 6
